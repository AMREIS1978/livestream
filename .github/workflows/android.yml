name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-24.04
    outputs:
      relay_url: ${{ steps.worker.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare credentials
        id: auth
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish free Cloudflare Worker
        if: steps.auth.outputs.ready == 'true'
        id: worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy
  build:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Resolve and verify relay
        env:
          DEPLOYED_URL: ${{ needs.deploy.outputs.relay_url }}
          EXISTING_URL: ${{ vars.LIVESTREAM_SERVER_URL }}
        run: |
          URL="${DEPLOYED_URL:-$EXISTING_URL}"
          URL="${URL%/}"
          if [[ "$URL" != https://* ]]; then
            echo "::error::No public HTTPS relay configured. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, or LIVESTREAM_SERVER_URL repository variable."
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 20 "$URL/health" | grep -q '"ok":true' || {
            echo "::error::Relay health check failed: $URL/health"
            exit 1
          }
          echo "LIVESTREAM_SERVER_URL=$URL" >> "$GITHUB_ENV"
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: livestream-debug-apk
          path: app/build/outputs/apk/debug/*.apk
