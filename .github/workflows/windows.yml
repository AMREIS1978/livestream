name: Build Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free build dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Build standalone Windows EXE
        run: python -m PyInstaller --onefile --windowed --name LiveStream --distpath desktop/dist desktop/livestream_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: livestream-windows-exe
          path: desktop/dist/LiveStream.exe
