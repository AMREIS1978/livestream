name: LiveStream 1.8 - APK com cameras e GPS
on:
  push:
    branches: [main]
    paths: ['app/**', 'duo-web/**', '.github/workflows/duo.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: livestream-duo-release
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      LIVESTREAM_SERVER_URL: https://livestremanew.a-miguel-reis.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar SDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Nome do ficheiro
        run: cp app/build/outputs/apk/debug/app-debug.apk LiveStream-1.8-cameras-GPS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LiveStream-1.8-cameras-GPS
          path: LiveStream-1.8-cameras-GPS.apk
      - name: Publicar download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="duo-1.8-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" LiveStream-1.8-cameras-GPS.apk --title "LiveStream 1.8 — câmaras e localização" --notes "APK de teste. Mantém a partilha de ecrã e acrescenta Câmaras + localização. Duas câmaras simultâneas dependem do equipamento. Este modo deve ficar aberto no ecrã. Assinatura de teste: uma instalação anterior pode exigir desinstalação se usar outra chave."
